# 起步配置：一个云端模型，验证网关本身能起、能列模型、能回话。
# 需要 GEMINI_API_KEY。没有 key 也能启动，但调用会失败。
# 验证通过后换成 config.example.yaml。

model_list:
  - model_name: vision-pro
    litellm_params:
      model: gemini/<当前Gemini型号>
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      supports_vision: true
      supports_function_calling: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 120

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY